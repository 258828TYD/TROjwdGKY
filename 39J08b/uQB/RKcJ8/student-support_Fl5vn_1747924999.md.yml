engines:
  brakeman:
    enabled: true
      # disable 'Parameter value used in file name', 
      # I (Zhewei) cannot find a good way to handle this problem right now.
      file_access:
  bundler-audit:
    enabled: true
  csslint:
  coffeelint:
    enabled: false
  duplication:
    enabled: true
    config:
      languages:
      - ruby
    enabled: false
  fixme:
    enabled: true
  rubocop:
    enabled: true
    checks:
      Rubocop/Metrics/LineLength:
ratings:
  - "**.erb"
  - "**.haml"
  - "**.rb"
- 'db/**/*'
- 'lib/**/*'
- 'public/**/*'
- 'vendor/**/*'
